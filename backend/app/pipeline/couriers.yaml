# Courier AWB patterns derived from Phase 0/1 manual inspection of sample_data/raw
# (see docs/dataset-notes.md section 3). Patterns are generic (length + digit
# structure), not hard-coded to specific AWB values. Confidence notes record how
# the courier name was confirmed, since most parcels never show a legible courier
# logo and only the AWB number itself is visible. Clusters with no legible courier
# name are kept as unknown_prefix_<N> regex buckets per Phase 1 instructions -
# the pattern is what matters for extraction, the name is cosmetic.
#
# IMPORTANT: a large share of this dataset carries a warehouse sorter-camera text
# overlay (burned into the frame) that itself reports an "AWB No" / "Barcode" field
# in the same numeric style as below. That overlay is a separate, very reliable
# text source (see dataset-notes.md section "Sorter overlay metadata") and is
# parsed by overlay.py using these same patterns.

couriers:
  - name: "Delhivery"
    awb_regex: "^191[0-9]{11}$"
    awb_length: [14]
    prefixes: ["191"]
    barcode_types: ["QRCode", "Code128"]
    checksum: null
    notes: >
      Confirmed by "DELHIVERY" wordmark on poly-bags/tape and "Delhivery Direct
      App" text in several images. By far the most common AWB prefix in the
      dataset (most of weight_image_* and plain-numbered images). QR code
      decoded directly in the spike on one Delhivery poly-bag
      (weight_image_19106721744493...). 14-digit numeric, starts "191"
      (corrected in Phase 1 - Phase 0's draft miscounted this as 11 digits).

  - name: "BlueDart"
    awb_regex: "^77[0-9]{9}$"
    awb_length: [11]
    prefixes: ["77"]
    barcode_types: ["Code128"]
    checksum: null
    notes: >
      Confirmed by explicit "Courier Name: BLUEDART" / "BLUE DART" text on
      shipping labels (e.g. ms7_jpeg, m_s_jpeg). Code128 barcode decoded
      directly in the spike for ms7 ('77549916382'). 11-digit numeric,
      starts "77" (seen: 775xxxxxxxx and 778xxxxxxxx).

  - name: "unknown_prefix_901"
    awb_regex: "^901[0-9]{8}$"
    awb_length: [11]
    prefixes: ["901"]
    barcode_types: ["Code128"]
    checksum: null
    notes: >
      The "believe. achieve." tagline (Xpressbees' slogan) appears on boxes
      carrying this AWB prefix (e.g. 90147261525, 90148582510, 90150050115 at
      sorter location "OEU"), but no courier name was ever legibly printed
      next to the AWB itself, so the courier identity is not confirmed - kept
      as an unknown bucket per Phase 1 instructions rather than asserting
      "Xpressbees" from the tagline alone.

  - name: "unknown_prefix_144"
    awb_regex: "^1[45][0-9]{12,13}$"
    awb_length: [14, 15]
    prefixes: ["144", "152"]
    barcode_types: []
    checksum: null
    notes: >
      Seen on Beardo-brand packaging (e.g. 14408950450567, 152907240809514) but
      the courier name itself was not legible in the sampled images. Beardo
      ships via multiple couriers (BlueDart confirmed elsewhere), so this is
      very likely a second, unidentified courier rather than a Beardo-specific
      scheme.

  - name: "unknown_prefix_310495"
    awb_regex: "^310495[0-9]{8}$"
    awb_length: [14]
    prefixes: ["310495"]
    barcode_types: []
    checksum: null
    notes: >
      Seen only inside the alternate sorter-overlay schema that labels this
      field "Barcode:" instead of "AWB No:" (green/white monospace overlay,
      locations Delhi_Bilaspur / Kolkata_Gateway / YKB_North_Zone). Also on
      Beardo-brand packaging. Courier identity not confirmed from any visible
      label text in the sampled images. 14-digit numeric (corrected in Phase 1
      - Phase 0's draft miscounted this as 11 digits).

  - name: "Generic"
    awb_regex: "^[A-Z0-9]{8,20}$"
    awb_length: [8, 20]
    prefixes: []
    barcode_types: ["Code128", "Code39", "QRCode", "DataMatrix"]
    checksum: null
    notes: "Fallback for any AWB-shaped candidate that does not match a known courier above."
